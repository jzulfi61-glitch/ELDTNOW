const slides=[{"section":"intro","sectionLabel":"Introduction","title":"Why Coupling and Uncoupling Requires Precision","contentHTML":"<p>Coupling and uncoupling are among the most hazardous procedures in tractor-trailer operations.</p><p><strong>Errors can result in:</strong></p><ul><li>Dropped trailers</li><li>Torn air and electrical lines</li><li>Cab and trailer damage</li><li>Freight damage</li><li>Serious injury or death</li></ul><p>Following the correct step-by-step procedure every time is non-negotiable.</p>","narration":"Coupling and uncoupling are procedures you&#39;ll perform regularly throughout your career — and they deserve full attention every single time. A dropped trailer isn&#39;t just inconvenient. It can tear air and electrical lines, damage the cab, destroy freight, and seriously injure anyone nearby. The procedures covered in this module exist for good reason: they protect you, your vehicle, your cargo, and everyone around you. Skip a step, and the consequences can be severe."},{"section":"intro","sectionLabel":"Introduction","title":"Learning Objectives","contentHTML":"<p>By the end of this module, you&#39;ll be able to:</p><ul><li>Describe the proper procedures for coupling and uncoupling combination vehicles</li><li>Identify how to inspect and test coupling components to verify safe operation</li><li>Explain how to operate landing gear, pull releases, and position converter dollies</li></ul>","narration":"This module walks you through everything you need to know about safely connecting and disconnecting a tractor from a trailer. You&#39;ll learn the full coupling and uncoupling sequences for single trailers, and the more complex procedures for doubles. You&#39;ll also understand how to inspect the fifth wheel and kingpin, operate the landing gear safely, and work with converter dollies when coupling twin trailers."},{"section":"coupling","sectionLabel":"Coupling","title":"Steps 1–3: Inspect, Check Area, and Position","contentHTML":"<p><strong>Step 1 — Inspect the Fifth Wheel and Kingpin:</strong></p><ul><li>Check for damaged, loose, or missing parts; confirm mounting is secure — no frame cracks or loose bolts</li><li>Grease the fifth wheel plate if needed (dry fifth wheels cause steering problems, especially in turns)</li><li>Fifth wheel should be tilted down toward the rear, jaws open, release handle in unlocked position</li><li>If sliding fifth wheel: confirm locked with all pins seated</li><li>Check trailer kingpin — must not be loose, bent, or broken</li><li>Verify shipment identity and securement; confirm fifth wheel position won&#39;t let tractor strike landing gear</li></ul><p><strong>Step 2 — Check Area and Secure Trailer:</strong></p><ul><li>Ensure area is clear; check cargo for shift risk; chock trailer wheels or verify spring brakes applied; confirm trailer sliding axle is locked</li></ul><p><strong>Step 3 — Position the Tractor:</strong></p><ul><li>Align squarely and directly in front of trailer — never at an angle</li><li>Kingpin should align with fifth wheel throat; back until just before fifth wheel contacts the trailer apron</li><li>Use mirrors to confirm drive wheels are centered under the trailer</li></ul>","narration":"Before you move the tractor anywhere near the trailer, you need to do a thorough inspection. The fifth wheel and kingpin connection is the heart of the coupling — if either component is damaged or out of position, the coupling won&#39;t hold. Grease the fifth wheel if it&#39;s dry; an improperly greased fifth wheel creates extra friction that leads to steering problems. The fifth wheel should be tilted back, jaws open, and the release handle in the unlocked position. If it&#39;s a sliding fifth wheel, make sure it&#39;s locked. Then check the trailer area — confirm everything is clear, the wheels are chocked, and the axle assembly is locked. When you&#39;re ready to move, align the tractor squarely in front of the trailer. Backing at an angle risks pushing the trailer sideways and breaking the landing gear."},{"section":"coupling","sectionLabel":"Coupling","title":"Steps 4–6: Back in, Secure, and Check Height","contentHTML":"<p><strong>Step 4 — Back Slowly into Position:</strong></p><ul><li>Back slowly toward the front of the trailer; stop when the fifth wheel just touches the trailer apron</li><li>For sleeper cabs: back until rear axle is just under the front of the trailer</li><li>If trailer appears too low to clear the tractor frame, stop and raise trailer height — never bump or force</li></ul><p><strong>Step 5 — Secure the Tractor:</strong></p><ul><li>Shift to neutral; apply parking brake before exiting</li></ul><p><strong>Step 6 — Check the Trailer Height:</strong></p><ul><li>Trailer should be low enough to contact the back half of the fifth wheel and raise slightly when tractor backs under it</li><li>Too low: tractor may strike the trailer nose &nbsp;|&nbsp; Too high: trailer may miss the kingpin or hit the rear of the cab</li><li>Adjust by cranking landing gear or adjusting air suspension</li><li>Confirm kingpin is aligned with the fifth wheel throat</li><li><strong>CAUTION: Never go under a trailer that is not supported by a tractor or stable structure</strong></li></ul>","narration":"Back slowly until the fifth wheel just touches the trailer apron. Don't drive forcefully into position — you should feel light contact, not a hard bump. For sleeper cabs with no rear window, back until the rear axle slides just under the trailer's front. Before you get out, shift to neutral and set the parking brake. Then go check the trailer height. The trailer should be positioned so the tractor raises it slightly when it backs underneath. If the trailer is too low, the tractor frame or nose of the trailer will make contact. If it&#39;s too high, the kingpin could miss the fifth wheel entirely and the trailer could fall onto the cab. Adjust using the landing gear crank or air suspension. And a serious safety note: never get under a trailer that isn&#39;t properly supported."},{"section":"coupling","sectionLabel":"Coupling","title":"Steps 7–9: Air Lines, Air Supply, Start Engine","contentHTML":"<p><strong>Step 7 — Connect the Air Lines:</strong></p><ul><li>Two lines: <strong>service</strong> (blue or black) and <strong>emergency</strong> (red); may be color-coded, labeled, or shape-coded (square = service, round = emergency)</li><li>Driver's side trailer glad hand = emergency; passenger's side = service</li><li>Inspect all four glad hand seals (rubber grommets) for cracks or damage</li><li>Connect emergency line first; rotate glad hand 90° to lock; then connect service line</li><li>Ensure enough slack so glad hands won&#39;t uncouple; support lines so they won&#39;t be crushed</li><li>Loose emergency line → trailer brakes lock up; loose service line → serious air leak when brakes applied</li></ul><p><strong>Step 8 — Supply Air to the Trailer</strong> (only if brakes not already set — pre-1975 trailers):</p><ul><li>Push in air supply knob or move valve from 'emergency' to 'normal'; wait for normal pressure; listen for air leaks; apply and release trailer brakes to confirm operation</li></ul><p><strong>Step 9 — Start the Engine and Set Trailer Brakes:</strong></p><ul><li>Verify air pressure is normal, then start engine; apply trailer brakes by pulling out air supply knob or moving valve to emergency</li></ul>","narration":"Before you connect the tractor to the trailer, you need to hook up the air lines. There are two: the service line, usually blue or black, and the emergency line, usually red. Some glad hands are color-coded; others are labeled or shaped differently — square for service, round for emergency. On the trailer, the driver&#39;s side glad hand is the emergency connection, and the passenger side is the service connection. Inspect all four rubber seals before connecting — a cracked or damaged grommet means an air leak. Connect the emergency line first, rotating the glad hand 90 degrees to lock it in. Then the service line. Make sure there&#39;s enough slack to avoid the glad hands uncoupling during movement. A loose emergency line causes the trailer brakes to lock. A loose service line causes a major air leak when you apply the brakes. If the trailer is a pre-1975 model without spring brakes, you&#39;ll need to supply air to set the brakes before backing under."},{"section":"coupling","sectionLabel":"Coupling","title":"Steps 10–12: Connect, Tug Test, Secure","contentHTML":"<p><strong>Step 10 — Back Under the Trailer:</strong></p><ul><li>Use lowest reverse gear; release tractor parking brake; back slowly</li><li>The trailer apron should contact the fifth wheel and visibly lift the trailer in the mirror</li><li>If the trailer doesn&#39;t lift when the fifth wheel goes under the apron: stop, set brakes, recheck height</li><li>Stop when you hear and/or feel the fifth wheel jaws close around the kingpin</li><li><strong>Hitting the kingpin too hard can damage the kingpin, fifth wheel, landing gear, and cargo</strong></li></ul><p><strong>Step 11 — Tug Test:</strong></p><ul><li>With trailer brakes still locked, put tractor in low gear; gently pull forward — stop when you feel resistance</li><li>Repeat two more times: once with wheel turned left, once with wheel turned right</li></ul><p><strong>Step 12 — Secure the Vehicle:</strong></p><ul><li>Transmission to neutral; apply tractor parking brakes; shut off engine; take keys before going under the trailer</li></ul>","narration":"Now you&#39;re ready to make the main connection. Use the lowest reverse gear and back slowly until you feel and hear the fifth wheel jaws snap around the kingpin. You should see the trailer rise slightly in your mirror as the fifth wheel goes under the apron. If it doesn&#39;t lift, stop immediately, set the brakes, and go back and check the trailer height again. Don't drive into the kingpin hard — too much force damages components. Once connected, perform the tug test. With the trailer brakes locked, put the tractor in low gear and gently pull forward. Stop when you feel the trailer holding. Repeat with the wheel turned left and then right. This confirms the connection holds even at angles. Then secure the vehicle — neutral, parking brake on, engine off, keys in your pocket — before you go under the trailer."},{"section":"coupling","sectionLabel":"Coupling","title":"Step 13: Inspect the Coupling","contentHTML":"<p>The coupling inspection requires going under the trailer with a flashlight:</p><ul><li>Verify there is <strong>NO space</strong> between the fifth wheel plate (lower) and the trailer apron (upper) — full contact is required</li><li>Any gap means something is wrong — do not move the vehicle until you find and fix the problem</li><li>Look into the fifth wheel throat with the flashlight: jaws must be closed and locked around the <strong>shank</strong> of the kingpin — not the head</li><li>Check that the release arm is in the locked position</li><li>Check that the safety latch is over the release arm (on fifth wheels that have one; some must be placed by hand)</li><li><strong>If the coupling is not correct in any way — do not move the vehicle</strong></li></ul>","narration":"The coupling inspection is not optional. You need a flashlight, and you need to get under the trailer. First, check that the fifth wheel plate and trailer apron are in full contact — no gaps anywhere. If you see a gap, stop and find out why. It could be uneven ground, or the kingpin could be sitting on a ridge rather than properly inside the jaws, which means the trailer could come loose easily. With the flashlight, look into the throat of the fifth wheel and confirm the jaws are closed around the shank of the kingpin — not the head. Verify the release arm is in the locked position, and if your fifth wheel has a safety latch, make sure it&#39;s properly over the release arm. Some latches must be placed by hand. If anything about the coupling doesn&#39;t look right, do not move that vehicle."},{"section":"coupling","sectionLabel":"Coupling","title":"Steps 14–16: Electrical, Landing Gear, Remove Chocks","contentHTML":"<p><strong>Step 14 — Connect Electrical Cord and Check Air Lines:</strong></p><ul><li>Plug in electrical cord and fasten safety latch — don&#39;t force a connection that doesn&#39;t fit</li><li>If air lines weren't connected earlier (per carrier policy), connect them now</li><li>Set tractor brakes, release trailer brakes, and listen for air leaks; ensure lines won&#39;t snag moving parts or rest on the catwalk</li></ul><p><strong>Step 15 — Raise the Landing Gear:</strong></p><ul><li>Inspect landing gear for cracks and alignment before cranking</li><li>Put crank in low gear; stand facing forward or rear, feet shoulder-width apart, use both hands; crank until tractor bears trailer weight</li><li>Shift to high gear; face trailer, one hand on trailer for stability; crank fully up — do not spin crank quickly</li><li>Check clearance between rear of tractor frame and landing gear; check clearance between top of tractor tires and trailer nose</li><li><strong>CAUTION: Never drive with landing gear only partially raised — it can catch on railroad tracks</strong></li><li>Common cranking injuries: knocked-out teeth, broken nose, strains, sprains, torn ligaments</li></ul><p><strong>Step 16 — Remove Chocks:</strong></p><ul><li>Remove wheel chocks and store them safely</li></ul>","narration":"You&#39;re almost done. Plug in the electrical cord and fasten the safety latch. If your carrier's policy required waiting to connect the glad hands until after coupling, do that now. Set the tractor brakes, release the trailer brakes, and listen carefully for any air leaks — a leak anywhere in the system is a problem that needs to be fixed before you move. Now raise the landing gear. Always inspect the landing gear first. Put the crank in low gear before you start. Stand with feet apart, face the front or back of the rig, and use both hands — this protects you from the crank handle kicking back. Common injuries include broken teeth, broken noses, and torn ligaments from improper technique. Once the tractor is carrying the weight, switch to high gear and crank it all the way up. Never leave the landing gear partially raised — it can catch on railroad tracks. Check clearances around the tractor frame and tires. Then pull the wheel chocks and store them."},{"section":"uncoupling","sectionLabel":"Uncoupling","title":"Uncoupling Steps 1–3: Position, Secure, and Chock","contentHTML":"<p><strong>Step 1 — Position the Rig:</strong></p><ul><li>Choose a level surface capable of supporting the trailer's weight; look for designated trailer drop areas</li><li>Avoid dirt, sand, gravel, and hot blacktop (landing gear can sink); use boards to spread weight if necessary</li><li>Align tractor with trailer — pulling out at an angle can damage the landing gear</li></ul><p><strong>Step 2 — Secure the Trailer and Ease Pressure on Locking Jaws:</strong></p><ul><li>Pull out trailer air supply button to lock trailer brakes</li><li>Gently back up to ease pressure off the fifth wheel locking jaws</li><li>Apply tractor parking brakes while pushing against the kingpin; put transmission in neutral; turn off engine</li></ul><p><strong>Step 3 — Chock the Trailer Wheels:</strong></p><ul><li>Chock wheels, or verify spring brakes are applied</li><li>Pre-1975 trailers without spring brakes may lose air over time — wheels must be chocked</li></ul>","narration":"Uncoupling has 12 steps. Start by choosing the right spot. The surface must be level and capable of supporting the trailer's weight. Designated drop areas are ideal — some have concrete pads. Avoid areas where the landing gear could sink, like hot blacktop or loose gravel. Use boards if necessary. Align the tractor straight — an angled departure damages the landing gear. Lock the trailer brakes by pulling the air supply button. Then gently back up just a bit to take pressure off the fifth wheel jaws — this makes the release much easier. Apply the tractor parking brake while you&#39;re still pushing against the kingpin, then put it in neutral and shut down. Get out and chock the wheels, especially if the trailer doesn&#39;t have spring brakes."},{"section":"uncoupling","sectionLabel":"Uncoupling","title":"Uncoupling Steps 4–6: Landing Gear, Air Lines, Fifth Wheel Release","contentHTML":"<p><strong>Step 4 — Lower the Landing Gear:</strong></p><ul><li>Inspect landing gear for damage or cracks first</li><li>Lower until both supports make firm contact with the ground</li><li>For loaded trailers: after ground contact, crank a few extra turns in low gear to lift some weight off the tractor (eases fifth wheel release) — do NOT lift trailer off the fifth wheel</li><li>Always leave landing gear in low gear when done; if tractor has air ride, lower in low gear until air begins releasing</li></ul><p><strong>Step 5 — Disconnect Air Lines and Electrical Cord:</strong></p><ul><li>Disconnect air lines from trailer; connect glad hands to dummy couplers on back of cab, or couple them together</li><li>Hang electrical cord with plug facing down to prevent moisture entry; support lines so they won&#39;t be damaged</li></ul><p><strong>Step 6 — Unlock the Fifth Wheel:</strong></p><ul><li>Pull the fifth wheel release handle: bend at knees, use release hook if needed, keep feet clear of rear tractor wheels, square up with handle and pull straight out</li><li>If handle won&#39;t release: ease pressure by backing gently, set brake while pushing against kingpin, then try again</li></ul>","narration":"Lower the landing gear slowly and carefully. Inspect it first. Once both supports are firmly on the ground, a loaded trailer gets a few extra cranks in low gear to transfer some weight off the tractor — this makes the fifth wheel release easier and the next coupling easier too. But don&#39;t lift the trailer off the fifth wheel. Always leave the crank in low gear when you&#39;re done. If the tractor has air ride, keep going in low gear until you hear air starting to release. Now disconnect the air lines — mate the glad hands to the dummy couplers on the back of the cab, or connect them together. Hang the electrical cord with the plug facing down to keep moisture out. Support everything so lines won&#39;t drag or be damaged. Now pull the fifth wheel release. Bend at the knees, use a release hook if needed, keep your feet away from the tractor wheels, and pull straight out. If it won&#39;t move, ease the pressure by backing up slightly, set the brake while pushing against the kingpin, then try again."},{"section":"uncoupling","sectionLabel":"Uncoupling","title":"Uncoupling Steps 7–12: Clear the Tractor","contentHTML":"<p><strong>Step 7 — Lower Air Suspension</strong> (if equipped):</p><ul><li>Drive forward one foot; move switch to dump/lower; wait for air bags to fully deflate before pulling clear — if not deflated, rear of tractor will lurch up</li></ul><p><strong>Step 8 — Pull Tractor Partially Clear:</strong></p><ul><li>Release tractor parking brake; pull forward until fifth wheel just begins to clear the trailer apron</li><li><strong>Stop with tractor frame still under the trailer</strong> — prevents trailer from crashing if landing gear fails</li></ul><p><strong>Step 9 — Secure the Tractor:</strong></p><ul><li>Apply parking brake; put transmission in neutral; exit cab</li></ul><p><strong>Step 10 — Inspect Trailer Supports:</strong></p><ul><li>Verify ground is supporting the trailer; confirm landing gear is not sinking or damaged</li></ul><p><strong>Step 11 — Pull the Tractor Clear:</strong></p><ul><li>Release parking brakes; confirm area is clear; slowly drive tractor out from under the trailer; use safety jack if needed</li></ul><p><strong>Step 12 — Raise Air Suspension:</strong></p><ul><li>If equipped: reinflate the air bags</li></ul>","narration":"If your tractor has air ride suspension, drive one foot forward and flip the dump switch. Let the air bags fully drain — don&#39;t pull clear until they're deflated, or the rear of the tractor will lurch up when you pull out. Then pull forward just enough to clear the apron plate — but stop while the tractor frame is still under the trailer. That frame is a safety net: if the landing gear shifts or sinks, the trailer rests on the frame instead of falling. Get out, check that the landing gear is properly supporting the weight, and look for any sinking. Once you&#39;re confident the trailer is stable, get back in, check the area, and slowly drive the tractor clear. Use a trailer safety jack if there&#39;s any concern about the landing gear holding. Reinflate the air bags once you&#39;re clear."},{"section":"doubles","sectionLabel":"Coupling Doubles","title":"Coupling Doubles: Setup and First Connection","contentHTML":"<p><strong>Key rule: The most heavily loaded trailer must always go in the first position behind the tractor. The lighter trailer goes to the rear.</strong></p><p><strong>Step 1 — Secure the Rear Trailer:</strong></p><ul><li>If second trailer has no spring brakes (pre-1975): drive tractor close, connect emergency air supply line, charge trailer air tank, disconnect emergency line — this sets the emergency brakes; chock the wheels</li></ul><p><strong>Step 2 — Couple the Tractor to the First Trailer:</strong></p><ul><li>Follow the complete 16-step single-trailer coupling procedure</li></ul><p><strong>Step 3 — Position the Converter Dolly:</strong></p><ul><li>Manually roll or use tractor to move the dolly in front of the rear trailer</li><li>Stop before the fifth wheel makes contact with the trailer apron</li><li>Set the dolly's parking brake</li></ul>","narration":"Coupling doubles is more complex than coupling a single trailer, but the principles are the same. The most critical rule: your heavier trailer always goes first, directly behind the tractor. The lighter one goes to the rear. Start by securing the rear trailer — if it&#39;s a pre-1975 model without spring brakes, you&#39;ll use a specific air procedure to set its emergency brakes before moving it. Chock those wheels. Then couple the tractor to the first trailer using the complete 16-step process. Once that connection is solid, position the converter dolly in front of the rear trailer. Roll or drive it into position and stop before the fifth wheel makes contact with the apron. Set the dolly's parking brake."},{"section":"doubles","sectionLabel":"Coupling Doubles","title":"Coupling Doubles: Connecting Both Trailers","contentHTML":"<p><strong>Step 4 — Connect Dolly to First Trailer:</strong></p><ul><li>Back first trailer to dolly tongue; hook dolly, lock pintle hook, connect safety chains; secure converter gear support in raised position; connect air and electrical lines from dolly to rear of first trailer</li></ul><p><strong>Step 5 — Connect Dolly to Rear Trailer:</strong></p><ul><li>Verify rear trailer brakes locked and wheels chocked</li><li>Adjust height: trailer must be slightly lower than center of dolly fifth wheel so it rises slightly when dolly goes under</li><li>Back dolly under rear trailer until kingpin enters fifth wheel</li><li>Tug test: pull against the pin of the rear trailer</li><li>Visual check: no space between apron and fifth wheel; release arm locked; jaws closed around kingpin shank</li><li>Connect all air hoses and electrical cords between dolly and rear trailer</li><li>Close converter dolly air tank petcock; close shut-off valves at rear of second trailer; open shut-off valves at rear of first trailer and on dolly if equipped</li><li>Raise rear trailer landing gear fully</li><li>Charge trailers and verify air reaches rear of second trailer (open emergency line shut-off to check)</li></ul>","narration":"Once the dolly is positioned, you&#39;ll connect it at both ends. Back the first trailer to the dolly tongue. Hook up, lock the pintle hook, and connect the safety chains. Raise the converter gear support into the secured position. Connect the air lines and electrical cord from the dolly to the back of the first trailer, and stow the dummy connectors. Now back the dolly under the rear trailer. The height must be set so the rear trailer rises slightly when the dolly slides under — just like coupling a single trailer. Back it in until the kingpin engages. Tug test the rear trailer, then do a visual inspection — no gaps, jaws locked on the kingpin shank, release arm secured. Connect all air hoses and electrical lines between the dolly and rear trailer. Work through the valve opening and closing sequence to ensure air flows correctly through the entire combination. Raise the rear trailer's landing gear fully, charge the system, and verify air pressure reaches the back of the second trailer."},{"section":"doubles","sectionLabel":"Uncoupling Doubles","title":"Uncoupling Doubles","contentHTML":"<p><strong>Uncouple Rear Trailer First:</strong></p><ol><li>Park on level ground in a straight line; apply parking brakes; chock second trailer wheels if no spring brakes</li><li>Lower rear trailer landing gear enough to remove weight from dolly</li><li>Close air shut-offs at converter dolly or rear of first trailer</li><li>Disconnect air and electrical lines from dolly to rear trailer; secure them</li><li>Release dolly brakes if necessary; release converter dolly fifth wheel latch</li><li>Pull tractor, first trailer, and dolly forward — clear of rear trailer</li></ol><p><strong>⚠️ CAUTION: Never unlock the pintle hook with the dolly still under the rear trailer — the tow bar can fly up and cause serious injury.</strong></p><p><strong>Uncouple the Converter Dolly:</strong></p><ol start=\"7\"><li>Use first trailer to move dolly to desired location; lower dolly landing gear</li><li>Disconnect safety chains and air/electrical lines from dolly to first trailer</li><li>Apply converter gear spring brakes or chock wheels; release pintle hook; slowly pull clear</li></ol>","narration":"Uncoupling doubles goes in reverse order — rear trailer first, then the dolly. Park on level ground, in a straight line. Chock the second trailer's wheels if needed. Lower the landing gear of the rear trailer just enough to take weight off the dolly. Close the air shut-offs, disconnect the lines from the dolly to the rear trailer, and release the dolly fifth wheel latch. Pull the tractor, first trailer, and dolly forward, clear of the rear trailer. A critical warning: never unlock the pintle hook while the dolly is still under the rear trailer. The tow bar can fly upward under tension, causing serious injury. Once the rear trailer is dropped, use the first trailer to position the dolly where you want to park it. Lower the dolly's landing gear. Disconnect the safety chains and lines from the dolly to the first trailer. Apply the dolly's spring brakes or chock its wheels. Release the pintle hook on the first trailer and slowly pull free."},{"section":"other","sectionLabel":"Other Combinations","title":"Other Combinations and Final Responsibility","contentHTML":"<p>The procedures in this module apply to the most common tractor-trailer configurations.</p><p><strong>Important reminders:</strong></p><ul><li>Other combination types exist — it is your responsibility to learn the correct coupling and uncoupling procedures for any vehicle you drive</li><li>Practice each procedure repeatedly until you can perform it safely from memory</li><li>In the real world you&#39;ll encounter variables not found in training: unlevel surfaces, angled approaches, air leaks, mismatched glad hands — adjust your procedure accordingly</li><li><strong>The driver is always responsible for ensuring safe coupling and uncoupling — no exceptions</strong></li></ul>","narration":"This module has covered the most common coupling and uncoupling procedures. But there are other configurations out there, and it&#39;s your responsibility to learn the right procedures for whatever vehicle you&#39;re driving. The fundamentals are the same, but the details change. Here's what doesn&#39;t change: practice. You need to perform these procedures until they're automatic — because in the real world, conditions aren&#39;t always ideal. Surfaces are uneven, alignment is off, glad hands don&#39;t match, air leaks develop. You have to be able to adapt while maintaining the safety of every step. And no matter the situation — you, the driver, are responsible for the coupling and uncoupling being done correctly."}];
const quizData=[{"q":"What position should the fifth wheel be in before coupling?","opts":["Tilted up toward the front of the tractor, jaws closed","Tilted down toward the rear of the tractor, jaws open, release handle in unlocked position","Fully raised and locked with jaws in a neutral position","Adjusted to high position with locking pins removed"],"ans":1,"exp":"Before coupling, the fifth wheel should be tilted down toward the rear of the tractor, jaws open, and the release handle in the unlocked position. This allows the kingpin to enter the fifth wheel correctly."},{"q":"What is the 'tug test' in the coupling procedure?","opts":["Pulling the fifth wheel release handle to verify it is locked","Checking the glad hand connections by tugging on the air lines","With trailer brakes locked, gently pulling the tractor forward to confirm the trailer is locked onto the tractor","Inspecting the kingpin by manually attempting to move it"],"ans":2,"exp":"The tug test is performed after backing under the trailer. With the trailer brakes locked, the driver puts the tractor in low gear and gently pulls forward, stopping when resistance is felt. This is repeated with the wheel turned left and right."},{"q":"When inspecting the coupling under the trailer, what must you confirm about the fifth wheel jaws?","opts":["The jaws are open and ready for the next coupling","The jaws are closed and locked around the shank of the kingpin, not the head","The jaws are positioned around the head of the kingpin for maximum hold","The jaws are partially engaged but will fully close during driving"],"ans":1,"exp":"After coupling, the inspection requires confirming that the fifth wheel jaws are closed and locked around the shank of the kingpin — not the head. A gap between the apron and the fifth wheel plate also indicates a problem that must be resolved before moving."},{"q":"Why is it dangerous to hit the kingpin too hard when backing under the trailer?","opts":["It causes the clutch to disengage","It can damage the kingpin, fifth wheel, landing gear, and cargo","It automatically opens the fifth wheel jaws","It triggers the trailer's emergency brake system"],"ans":1,"exp":"Excessive force when backing under the trailer can cause significant damage to the kingpin, fifth wheel, landing gear, and the cargo inside the trailer. Back slowly and stop when you hear and feel the jaws engage."},{"q":"Which air line connects to the emergency glad hand on the trailer?","opts":["The blue service line","The black service line","The red emergency line","The yellow auxiliary line"],"ans":2,"exp":"The red emergency line connects to the emergency glad hand. When disconnected or damaged, the emergency line causes the trailer brakes to lock — which is a safety feature designed to prevent a runaway trailer."},{"q":"What should you do if the fifth wheel release handle will not pull?","opts":["Force the handle using a pry bar","Ease pressure on the fifth wheel jaws by backing up gently against the kingpin, then set tractor brake and try again","Remove the kingpin from the trailer","Disconnect the air lines and try again"],"ans":1,"exp":"If the release handle won&#39;t pull, ease the pressure on the jaws by backing the tractor gently until it pushes against the kingpin, then set the tractor brake while in that position. This relieves pressure on the locking jaws and allows the handle to be pulled."},{"q":"Why should you leave the landing gear in low gear after lowering it during uncoupling?","opts":["To prevent the landing gear from auto-retracting","So the next driver can crank it up without difficulty — leaving it in high gear makes the handle too hard to start cranking if the trailer is loaded","To reduce trailer nose height for proper kingpin alignment on recoupling","FMCSA regulations require low gear storage"],"ans":1,"exp":"Always leave the landing gear in low gear when done. If left in high gear and the trailer is loaded, the next driver may not be able to get enough torque to begin cranking the handle from its stowed position."},{"q":"What is the correct trailer height for coupling?","opts":["Level with the fifth wheel plate, top to top","Slightly lower than the fifth wheel center, so the trailer is raised slightly when the tractor backs under it","Higher than the fifth wheel to allow easy kingpin entry","At the same height as the rear of the tractor cab"],"ans":1,"exp":"The trailer should be positioned slightly lower than the center of the fifth wheel. This causes the trailer to be raised slightly as the tractor backs under it — ensuring correct kingpin entry and confirming engagement."},{"q":"What is the primary reason for never driving with landing gear only partially raised?","opts":["It creates steering instability","It causes air pressure to leak from the trailer air tank","The landing gear can catch on railroad tracks or other road obstacles","It interferes with the fifth wheel locking mechanism"],"ans":2,"exp":"Driving with the landing gear only partially raised risks catching it on railroad tracks, raised road edges, or other obstructions. The landing gear must always be fully raised before moving the vehicle."},{"q":"During uncoupling, why should you keep the tractor frame under the trailer when pulling partially clear?","opts":["To allow slack in the air lines before full disconnection","To perform the tug test from a partial position","If the landing gear collapses or sinks, the tractor frame prevents the trailer from crashing to the ground","So the trailer will have enough clearance for the landing gear to lower"],"ans":2,"exp":"Keeping the tractor frame under the trailer during the partial-clear step is a safety measure. If the landing gear fails or sinks unexpectedly, the trailer will rest on the tractor frame instead of dropping to the ground."},{"q":"For coupling doubles, which trailer must always go in the first position — directly behind the tractor?","opts":["The lighter trailer","The trailer with the most axles","The most heavily loaded trailer","The trailer that was coupled most recently"],"ans":2,"exp":"When coupling twin trailers, the most heavily loaded trailer must always be in the first position, directly behind the tractor. The lighter trailer goes to the rear. This configuration provides better stability and braking performance."},{"q":"When coupling a converter dolly to a rear trailer, what must you verify about the trailer height?","opts":["The trailer must be level with the dolly fifth wheel","The trailer must be higher than the dolly fifth wheel so the dolly can slide under without lifting","The trailer must be slightly lower than the center of the dolly fifth wheel so it raises slightly when the dolly goes under","The trailer must be at maximum landing gear height"],"ans":2,"exp":"Just like coupling a single trailer, the rear trailer must be positioned slightly lower than the center of the dolly's fifth wheel. This causes the trailer to lift slightly when the dolly backs under it, confirming a good connection."},{"q":"Why should you never unlock the pintle hook with the converter dolly still under the rear trailer?","opts":["The pintle hook is a load-bearing component that cannot be released under load","The dolly tow bar is under tension and can fly upward when released, potentially causing injury","Releasing the pintle hook under the trailer can damage the dolly fifth wheel","FMCSA requires the dolly to be fully clear before the pintle hook is released"],"ans":1,"exp":"When the dolly is under the rear trailer, the tow bar is under significant tension. Releasing the pintle hook in this position can cause the tow bar to spring upward with force, creating a serious risk of injury. Always pull the dolly clear of the rear trailer first."},{"q":"After raising the landing gear during coupling, what two clearances must you verify?","opts":["Clearance between the trailer doors and the dock","Clearance between the rear tractor frame and landing gear, and between the top of tractor tires and the trailer nose","Clearance between the fifth wheel and the trailer apron","Clearance between the kingpin and the fifth wheel jaws"],"ans":1,"exp":"After raising the landing gear, two clearances must be confirmed: there must be enough space between the rear of the tractor frame and the landing gear (to allow sharp turns without striking the gear), and between the top of the tractor tires and the underside of the trailer nose."},{"q":"If a gap is found between the trailer apron and the fifth wheel plate during the coupling inspection, what should you do?","opts":["Drive a short distance to allow the connection to fully seat","Tighten the fifth wheel adjustment bolts from under the trailer","Stop — do not move the vehicle until the problem is identified and corrected","Apply extra tension using the fifth wheel release handle"],"ans":2,"exp":"Any gap between the trailer apron and the fifth wheel plate indicates a problem with the coupling. The vehicle must not be moved until the issue is found and corrected."}];
const USE_MP3=false;const AUDIO_BASE_PATH='./audio/';
let audioTimerInterval=null,estimatedDuration=0,audioElapsed=0,audioPlayStart=0,isPlaying=false,isComplete=false,currentNarrationText='',currentAudio=null,currentUtterance=null;
const ICON_PLAY='<svg viewBox="0 0 12 12"><path d="M2.5 1.5v9l8-4.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 12 12"><path d="M2.5 1.5h2.5v9h-2.5zM7 1.5h2.5v9h-2.5z"/></svg>';
const ICON_DONE='<svg viewBox="0 0 12 12"><path d="M10.5 3l-6 6-2.5-2.5L1 7.5l3.5 3.5L11.5 4z"/></svg>';
let currentSlide=-1,completedSlides=new Set(),quizAnswers={},view='welcome';
function init(){Progress.markStarted(CURRENT_MODULE_SLUG);buildDropdown();buildTOC();showWelcome();}
function buildDropdown(){const all=Progress.getAll();const items=document.getElementById('dropdownItems');const hdr=document.getElementById('dropdownHeaderProgress');let done=0;REGISTRY.forEach(m=>{if(all[m.slug]&&all[m.slug].completed)done++;});hdr.textContent=done+' of '+REGISTRY.length+' complete';items.innerHTML='';REGISTRY.forEach(m=>{const isCurrent=m.slug===CURRENT_MODULE_SLUG;const prog=all[m.slug]||{};const unlocked=Progress.isUnlocked(m.slug,REGISTRY);const div=document.createElement('div');div.className='dropdown-item'+(isCurrent?' current':'')+((!unlocked)?' locked':' clickable');let icon='🔒',iconClass='';if(isCurrent){icon='▶';iconClass='';}else if(prog.completed){icon='✓';iconClass='color:var(--success)';}else if(unlocked){icon='○';iconClass='color:var(--blue)';}div.innerHTML='<span class="di-icon" style="'+iconClass+'">'+icon+'</span><span class="di-info"><span class="di-unit">UNIT '+m.unit+'</span><br><span class="di-title">'+m.title+'</span></span>';if(unlocked&&!isCurrent){div.addEventListener('click',()=>{window.location.href='../'+m.folder+'/'+m.file;});}items.appendChild(div);});}
const trigger=document.getElementById('unitTrigger'),menu=document.getElementById('dropdownMenu');
trigger.addEventListener('click',()=>{const open=menu.classList.toggle('open');trigger.setAttribute('aria-expanded',open);});
document.addEventListener('click',e=>{if(!document.getElementById('unitDropdown').contains(e.target)){menu.classList.remove('open');trigger.setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.classList.remove('open');trigger.setAttribute('aria-expanded','false');}});
function buildTOC(){const list=document.getElementById('tocList');list.innerHTML='';slides.forEach((s,i)=>{const done=completedSlides.has(i);const active=currentSlide===i;const accessible=done||i===0||completedSlides.has(i-1);const div=document.createElement('div');div.className='toc-item'+(active?' active':'')+(accessible?' accessible':'');div.innerHTML='<div class="toc-icon'+(done?' done':'')+(active&&!done?' active-icon':'')+'">'+( done?'✓':(i+1))+'</div><span class="toc-title">'+s.title+'</span>';if(accessible)div.addEventListener('click',()=>{showSlide(i);});list.appendChild(div);});const allDone=completedSlides.size===slides.length;const qDiv=document.createElement('div');qDiv.className='toc-item'+(view==='quiz'||view==='results'?' active':'')+(allDone?' accessible':'');qDiv.innerHTML='<div class="toc-icon'+(view==='results'?' done':'')+(view==='quiz'?' active-icon':'')+'">'+(view==='results'?'✓':'Q')+'</div><span class="toc-title">Knowledge Check</span>';if(allDone)qDiv.addEventListener('click',()=>{showQuiz();});list.appendChild(qDiv);updateProgressBar();}
function updateProgressBar(){const pct=slides.length>0?Math.round((completedSlides.size/slides.length)*100):0;document.getElementById('progressFill').style.width=pct+'%';}
function showWelcome(){view='welcome';currentSlide=-1;stopAudio();const main=document.getElementById('mainContent');main.innerHTML='<div class=\"welcome-view\"><div class=\"welcome-eyebrow\">Module 7 &nbsp;&middot;&nbsp; Unit 1.1.7</div><h1 class=\"welcome-title\">Coupling and Uncoupling</h1><div class=\"welcome-objectives\"><h3>What You&#39;ll Learn</h3><ul><li>Why coupling and uncoupling require strict procedure every time</li><li>The complete 16-step coupling procedure for single trailers</li><li>Fifth wheel and kingpin inspection requirements</li><li>The complete 12-step uncoupling procedure</li><li>Landing gear operation and safety rules</li><li>Coupling and uncoupling twin trailers (doubles) with a converter dolly</li></ul></div><button class=\"btn-primary\" onclick=\"showSlide(0)\">Start Module &#9658;</button></div>';buildTOC();}
function showSlide(idx){view='slide';currentSlide=idx;stopAudio();const s=slides[idx];const thisDone=completedSlides.has(idx);const main=document.getElementById('mainContent');main.innerHTML='<div class="slide-view"><div class="slide-label">'+s.sectionLabel+'</div><h2 class="slide-title">'+s.title+'</h2><div class="slide-content">'+s.contentHTML+'</div><div class="narration-box"><div class="narration-header"><div class="narration-label"><span class="narration-icon">🔊</span><span>Narration</span></div><div class="audio-control"><button class="audio-btn" id="audioBtn" type="button" aria-label="Pause narration" onclick="togglePlayPause()">'+ICON_PAUSE+'</button><span class="audio-btn-label playing" id="audioBtnLabel">Playing</span></div></div><div class="narration-text">'+s.narration+'</div><div class="audio-progress"><div class="audio-progress-fill" id="audioProgress"></div></div></div><div class="slide-nav"><button class="btn-nav btn-back" onclick="'+(idx===0?'showWelcome()':'showSlide('+(idx-1)+')') +'">← '+(idx===0?'Welcome':'Previous')+'</button><button class="btn-nav btn-next" id="nextBtn" onclick="advanceSlide('+idx+')" disabled>'+(idx===slides.length-1?'Go to Quiz →':'Next →')+'</button></div></div>';buildTOC();if(thisDone){onAudioComplete(true);}else{startAudio(s.narration);}}
function advanceSlide(idx){completedSlides.add(idx);buildTOC();if(idx===slides.length-1){showQuiz();}else{showSlide(idx+1);}}
function showQuiz(){if(completedSlides.size<slides.length)return;view='quiz';stopAudio();quizAnswers={};const main=document.getElementById('mainContent');let html='<div class="quiz-view"><div class="quiz-header"><h2>Knowledge Check</h2><p>Answer all 15 questions. You need 80% or higher (12 of 15) to pass.</p></div>';quizData.forEach((q,qi)=>{html+='<div class="quiz-q" id="qq'+qi+'"><div class="quiz-q-text">'+(qi+1)+'. '+q.q+'</div><div class="quiz-opts">';q.opts.forEach((o,oi)=>{html+='<div class="quiz-opt" id="opt'+qi+'_'+oi+'" onclick="selectOpt('+qi+','+oi+')"><span class="opt-letter">'+String.fromCharCode(65+oi)+'.</span><span>'+o+'</span></div>';});html+='</div><div class="quiz-exp" id="exp'+qi+'"></div></div>';});html+='<div class="quiz-actions"><button class="btn-primary" onclick="submitQuiz()">Submit Answers</button></div></div>';main.innerHTML=html;buildTOC();}
function selectOpt(qi,oi){if(quizAnswers[qi]!==undefined)return;quizAnswers[qi]=oi;document.querySelectorAll('#opt'+qi+'_0,#opt'+qi+'_1,#opt'+qi+'_2,#opt'+qi+'_3').forEach(el=>el.classList.remove('selected'));document.getElementById('opt'+qi+'_'+oi).classList.add('selected');}
function submitQuiz(){if(Object.keys(quizAnswers).length<quizData.length){alert('Please answer all questions before submitting.');return;}let correct=0;quizData.forEach((q,qi)=>{const chosen=quizAnswers[qi];const isCorrect=chosen===q.ans;if(isCorrect)correct++;document.getElementById('opt'+qi+'_'+q.ans).classList.add('correct');if(!isCorrect)document.getElementById('opt'+qi+'_'+chosen).classList.add('incorrect');const expEl=document.getElementById('exp'+qi);expEl.textContent=q.exp;expEl.classList.add('show');document.querySelectorAll('#qq'+qi+' .quiz-opt').forEach(el=>{el.style.pointerEvents='none';});});const pct=Math.round((correct/quizData.length)*100);const pass=pct>=80;if(pass){Progress.markComplete(CURRENT_MODULE_SLUG,pct);buildDropdown();}setTimeout(()=>showResults(correct,pct,pass),800);}
function showResults(correct,pct,pass){view='results';const main=document.getElementById('mainContent');const nextMod=REGISTRY[REGISTRY.findIndex(m=>m.slug===CURRENT_MODULE_SLUG)+1]||null;main.innerHTML='<div class="results-view"><div class="welcome-eyebrow">Knowledge Check Complete</div><div class="results-score '+(pass?'pass':'fail')+'">'+pct+'%</div><div class="results-badge '+(pass?'pass':'fail')+'">'+(pass?'✓ PASSED':'✗ NOT PASSED')+'</div><p class="results-msg">You answered <strong>'+correct+' of '+quizData.length+'</strong> questions correctly.'+(pass?' Great work — you&#39;ve completed this module!':' A score of 80% or higher is required to pass. Review the material and try again.')+'</p><div class="results-actions">'+(pass&&nextMod?'<a class="btn-continue" href="../'+nextMod.folder+'/'+nextMod.file+'">Continue to Module '+(REGISTRY.findIndex(m=>m.slug===CURRENT_MODULE_SLUG)+2)+': '+nextMod.title+' →</a>':'')+(pass&&!nextMod?'<a class="btn-continue" href="../index.html">Back to Course Home →</a>':'')+(!pass?'<button class="btn-primary" onclick="showQuiz()">Retake Quiz</button>':'')+'<button class="btn-retry" onclick="showWelcome()">Review Module</button></div></div>';buildTOC();}
function startAudio(text){stopAudio();currentNarrationText=text;audioElapsed=0;isComplete=false;isPlaying=true;setAudioControlPlaying();if(USE_MP3){const path=AUDIO_BASE_PATH+'slide_'+String(currentSlide).padStart(2,'0')+'.mp3';currentAudio=new Audio(path);estimatedDuration=text.length/14;currentAudio.play().catch(()=>onAudioComplete(false));currentAudio.addEventListener('ended',()=>onAudioComplete(false));currentAudio.addEventListener('error',()=>onAudioComplete(false));audioPlayStart=Date.now();startProgressTimer();}else{playTTS(text,0);}}
function playTTS(text,startFraction){window.speechSynthesis.cancel();const words=text.split(' ');const startWord=Math.floor(startFraction*words.length);const slicedText=words.slice(startWord).join(' ');const utter=new SpeechSynthesisUtterance(slicedText);utter.rate=0.95;utter.lang='en-US';currentUtterance=utter;estimatedDuration=(text.length/14)*(1-startFraction);audioPlayStart=Date.now();startProgressTimer();utter.onend=()=>{if(isPlaying)onAudioComplete(false);};utter.onerror=()=>{if(isPlaying)onAudioComplete(false);};window.speechSynthesis.speak(utter);}
function startProgressTimer(){clearInterval(audioTimerInterval);audioTimerInterval=setInterval(()=>{if(!isPlaying)return;const elapsed=audioElapsed+(Date.now()-audioPlayStart)/1000;const pct=Math.min(100,Math.round((elapsed/estimatedDuration)*100));const bar=document.getElementById('audioProgress');if(bar)bar.style.width=pct+'%';if(elapsed>=estimatedDuration){onAudioComplete(false);}},500);}
function stopAudio(){clearInterval(audioTimerInterval);window.speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio=null;}currentUtterance=null;isPlaying=false;}
function togglePlayPause(){if(isPlaying){pauseAudio();}else{resumeAudio();}}
function pauseAudio(){audioElapsed+=(Date.now()-audioPlayStart)/1000;clearInterval(audioTimerInterval);if(USE_MP3&&currentAudio){currentAudio.pause();}else{window.speechSynthesis.cancel();}isPlaying=false;setAudioControlPaused();}
function resumeAudio(){if(isComplete)return;isPlaying=true;audioPlayStart=Date.now();if(USE_MP3&&currentAudio){currentAudio.play();startProgressTimer();}else{const frac=audioElapsed/(estimatedDuration||1);playTTS(currentNarrationText,Math.min(frac,0.99));}setAudioControlPlaying();}
function setAudioControlPlaying(){const btn=document.getElementById('audioBtn');const lbl=document.getElementById('audioBtnLabel');if(btn){btn.innerHTML=ICON_PAUSE;btn.disabled=false;btn.setAttribute('aria-label','Pause narration');}if(lbl){lbl.textContent='Playing';lbl.className='audio-btn-label playing';}}
function setAudioControlPaused(){const btn=document.getElementById('audioBtn');const lbl=document.getElementById('audioBtnLabel');if(btn){btn.innerHTML=ICON_PLAY;btn.disabled=false;btn.setAttribute('aria-label','Resume narration');}if(lbl){lbl.textContent='Paused';lbl.className='audio-btn-label paused';}}
function setAudioControlDone(){const btn=document.getElementById('audioBtn');const lbl=document.getElementById('audioBtnLabel');if(btn){btn.innerHTML=ICON_DONE;btn.disabled=true;btn.setAttribute('aria-label','Narration complete');}if(lbl){lbl.textContent='Complete';lbl.className='audio-btn-label complete';}}
function onAudioComplete(skipUnlock){clearInterval(audioTimerInterval);isPlaying=false;isComplete=true;const bar=document.getElementById('audioProgress');if(bar)bar.style.width='100%';setAudioControlDone();if(!skipUnlock){const nextBtn=document.getElementById('nextBtn');if(nextBtn)nextBtn.disabled=false;}}
init();
</script>
</body>
</html>
