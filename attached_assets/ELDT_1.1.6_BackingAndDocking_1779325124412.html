const slides = [{"section":"intro","sectionLabel":"Introduction","title":"Why Backing Demands Your Full Attention","contentHTML":"<p>Backing is one of the most dangerous maneuvers a professional driver performs.</p><p><strong>Two core reasons to avoid backing when you can:</strong></p><ul><li>Limited visibility — your blind spot constantly shifts as you back</li><li>The tractor and trailer follow different paths when reversing</li></ul><p>When possible, park so you can pull forward. Use <strong>GOAL — Get Out And Look</strong> — every time.</p>","narration":"Backing is where accidents happen. It&#39;s one of the highest-risk maneuvers you&#39;ll perform as a professional driver, and the consequences of a mistake range from minor damage to serious injury. There are two core reasons backing is so challenging: you always have a blind spot — and it moves constantly — and your tractor and trailer don&#39;t follow the same path when you reverse. Whenever you have the option, park so you can drive forward when you leave. And when you must back, always use GOAL: Get Out And Look."},{"section":"intro","sectionLabel":"Introduction","title":"Learning Objectives","contentHTML":"<p>By the end of this module, you&#39;ll be able to:</p><ul><li>Recognize the steering principles required for successfully backing a tractor-trailer</li><li>Recall general guidelines for safe backing</li><li>Describe the appropriate backing maneuver for each situation</li><li>Explain additional precautions for parking lots and loading dock areas</li></ul>","narration":"Here's what this module covers. You&#39;ll learn the steering techniques that make backing work, the general rules that keep you safe every time, how to choose and execute the right maneuver for the situation, and the extra precautions required at docks and in parking lots."},{"section":"safety","sectionLabel":"General Safety","title":"Before You Back: GOAL and General Safety","contentHTML":"<p><strong>Get Out And Look (GOAL) — every time, before every backing maneuver:</strong></p><ul><li>Stop the truck; set parking brakes; turn on four-way flashers</li><li>Pocket the keys if you shut off the engine</li><li>Walk all sides of the vehicle — check for people, equipment, debris, parked vehicles</li><li>Walk all the way to the loading dock to confirm a clear path</li><li>Look up for overhead obstructions: wires, pipes, tree limbs, awnings, air conditioners</li><li>Check for underside snags: steep dock approaches, raised curbs</li><li>Warn others that the truck is about to back</li><li>If in doubt at any point — stop and look again</li><li>Any delay after your initial check? Do the check again before moving</li></ul>","narration":"Before you move an inch in reverse, you need to get out and look. Set your parking brakes, flip on the four-ways, and pocket your keys. Then walk every side of the vehicle — not just a glance from the cab, but a full walk-around. Look for people, equipment, vehicles, and anything on the ground. Go all the way to the dock to confirm the path is clear. Look up — overhead obstructions like wires, pipes, or awnings can take off a trailer vent or air conditioner. And look for anything low that could snag the underside. If anything has changed by the time you get back in the cab, get out and check again."},{"section":"safety","sectionLabel":"General Safety","title":"Back Slowly, Use Your Equipment","contentHTML":"<p><strong>General rules for every backing maneuver:</strong></p><ul><li>Eliminate all noise: radio, CB, cab fans, phone — roll your window down so your ears can help</li><li>Back as slowly as possible — lowest reverse gear</li><li>Do not accelerate beyond idle speed; do not ride the clutch</li><li>Use your four-way flashers and backup alarm at all times</li><li>If no backup alarm: periodically tap the horn</li><li>Open and secure trailer doors before docking to prevent damage on approach</li></ul>","narration":"When you back, slow and quiet is the rule. Turn everything off that makes noise — radio, CB, fans, your phone. Roll the window down. You&#39;ll hear things your mirrors can&#39;t show you. Use idle speed only; don&#39;t accelerate and don&#39;t ride the clutch. Keep your flashers going and let your backup alarm do its job. If you don&#39;t have a backup alarm, tap the horn every so often to let people know you&#39;re moving. If you&#39;re heading to a dock with outward-opening trailer doors, make sure they're secured open before you begin so they don&#39;t swing and get torn off on approach."},{"section":"safety","sectionLabel":"General Safety","title":"Using a Spotter","contentHTML":"<p>A spotter makes backing easier — but the driver is always responsible:</p><ul><li>Use a qualified, experienced spotter when possible</li><li>Agree on hand signals before starting — the most critical signal is <strong>STOP</strong></li><li>Never rely on voice signals alone — docking areas are noisy</li><li>Spotter should wear a reflective vest or bright clothing</li><li>If you can&#39;t see the spotter in your mirrors — <strong>stop immediately</strong></li><li>The spotter must be positioned where you can see them at all times</li><li>Know your motor carrier's policy on the use of spotters</li><li>Regardless of what the spotter signals, <strong>you as the driver bear full responsibility</strong></li></ul>","narration":"A good spotter is a real asset, but only if they know what they're doing. Before you start, agree on your hand signals — especially the stop signal. Dock areas are loud, so don&#39;t rely on shouting. Your spotter should be wearing something bright so you can see them in the mirrors. The moment you lose sight of the spotter — stop. Don't move until they're back in view. And remember: no matter what your spotter signals, you are the driver, and you are responsible for everything that happens during that backing maneuver."},{"section":"steering","sectionLabel":"Steering Principles","title":"Steering Principles for Backing","contentHTML":"<p>Backing a tractor-trailer uses different logic than backing a personal vehicle — the rear tractor axle steers the trailer.</p><p><strong>Two core rules:</strong></p><ul><li>Always steer <em>opposite</em> to the direction you want the trailer to go — trailer right → turn wheel left</li><li>Changing the tractor's direction changes the trailer's direction</li></ul><p><strong>Four steering techniques:</strong></p><ul><li><strong>Jacking</strong> — turn the wheel to swing the trailer into a new direction</li><li><strong>Chasing</strong> — steer just enough for the tractor to follow the trailer; turn toward drift to correct</li><li><strong>Following</strong> — turn toward the trailer until the angle stays constant; adjust more or less as needed</li><li><strong>Push-pull</strong> — when the trailer looks bigger in one mirror, push the wheel toward that mirror to correct</li></ul>","narration":"Backing a big rig is not like backing your car. In a personal vehicle, the front axle steers. In a tractor-trailer, it&#39;s the rear tractor axle that steers the trailer. And here's the key rule: to move the trailer in any direction, turn the steering wheel the opposite way. Want the trailer to go right? Turn left. This takes practice to feel natural. There are four core backing techniques. Jacking is when you turn the wheel to swing the trailer into position. Chasing is when you steer just enough to follow the trailer's path and correct any drift. Following keeps the angle constant by turning toward the trailer. And push-pull is your mirror guide — when the trailer looks bigger in one mirror, push the wheel toward that mirror to bring it back on track."},{"section":"steering","sectionLabel":"Steering Principles","title":"Sight Side vs. Blind Side Backing","contentHTML":"<p><strong>Sight Side Backing</strong> (backing toward the left/driver&#39;s side):</p><ul><li>You can see along the trailer's intended path in your left mirror</li><li>Preferred — maximum visibility</li></ul><p><strong>Blind Side Backing</strong> (backing toward the right/passenger's side):</p><ul><li>You can only see through rear-view mirrors — no direct view of the trailer's path</li><li>More difficult and more dangerous — visibility is severely limited</li><li>Avoid blind side backing when possible</li><li>If you must: use a spotter, and stop every few feet to check clearances</li></ul>","narration":"Sight side backing means you&#39;re moving toward the left — the driver&#39;s side. You can actually see along the path your trailer is taking through your left mirror. That&#39;s why it&#39;s preferred. Blind side backing means you&#39;re going toward the right — and you can only see what's happening through your mirrors with no direct view of the trailer's path. It&#39;s harder and more dangerous. Avoid it when you can. If blind side backing is the only option, use a spotter, go slowly, and stop every few feet to check your clearances before continuing."},{"section":"maneuvers","sectionLabel":"Backing Maneuvers","title":"Straight Line Backing","contentHTML":"<p>The foundation of all other backing maneuvers — master this first.</p><ul><li>Line up so you have as straight a starting position as possible</li><li>Back slowly and use both mirrors constantly</li><li>Maintain your path using push-pull steering</li><li>Don't over-steer — small corrections work better than big moves</li><li>If you drift too far off course: pull forward, reposition the trailer, and start fresh</li><li>Never try to force a bad line back into alignment while continuing in reverse</li></ul>","narration":"Straight line backing is where every driver starts. Get your line-up as straight as possible before you begin — the more crooked your setup, the harder the maneuver. Once you&#39;re moving, use both mirrors and make small corrections with push-pull steering. Resist the urge to over-steer — big wheel movements cause the trailer to swing too far. And if you drift far enough off course that you can&#39;t bring it back with small corrections, pull forward, reset your position, and start again. There&#39;s no penalty for repositioning. Forcing a bad line will only make it worse."},{"section":"maneuvers","sectionLabel":"Backing Maneuvers","title":"Alley Dock Backing — Setup","contentHTML":"<p>Alley dock combines sight side backing with a 90-degree turn into a space on the left.</p><ol><li>Approach at a right angle with the dock on your left; check left mirror; turn left to get the trailer's rear close to the alley</li><li>Turn right to straighten out; get as close to the alley as possible</li><li>Check right-side clearance; when the trailer nose passes the alley's center, turn the wheel right</li><li>Turn hard left when the tractor has used ¾ of forward space; stop when the tractor is parallel to the starting position</li><li><strong>GOAL</strong> — get out; check the left rear corner of trailer and your target; check clearances; map the path; open and secure trailer doors</li></ol>","narration":"Alley dock backing puts the trailer into a space that&#39;s 90 degrees off to your left — like backing into a loading dock from a street. Here's the setup sequence. First, approach at a right angle with the dock on your left. Turn left to get the rear of the trailer close to the opening. Then turn right to straighten up and get close. When the nose of your trailer passes the alley's center, turn right. As you use up about three-quarters of your forward space, turn hard left and stop when the tractor is parallel to where you started. Now stop, get out, and look — check your target, your clearances on all sides, and the path you want the trailer to follow. Open and secure your trailer doors while you&#39;re out there."},{"section":"maneuvers","sectionLabel":"Backing Maneuvers","title":"Alley Dock Backing — Execution","contentHTML":"<p><strong>Step 6 — Begin backing:</strong></p><ul><li>Start with straight steering</li><li>Jack the wheel if the trailer path is going too wide</li><li>Turn left to chase if the trailer is cutting too short</li><li>Turn hard left just before the trailer reaches the target line</li><li>Straighten the tractor so tractor and trailer finish in a line</li><li>Stop about 3–4 feet from the dock</li></ul><p><strong>Step 7 — Final approach:</strong></p><ul><li>Set the parking brake; get out and check remaining space</li><li>Ease the trailer the final distance to the dock</li></ul>","narration":"Once you&#39;ve completed your GOAL check and you&#39;re back in the cab, you&#39;re ready to back in. Start with straight steering — don&#39;t start jacking immediately. Watch your mirrors. If the trailer is swinging too wide, jack the wheel toward the dock. If it&#39;s cutting too short, turn left to chase. Just before the trailer lines up with the target, turn hard left to bring the tractor in line with the trailer. Stop about three to four feet from the dock. Get out, check the final gap, then ease the last distance in. When the trailer is at the dock, chock your wheels."},{"section":"maneuvers","sectionLabel":"Backing Maneuvers","title":"Sight Side Jackknife Backing","contentHTML":"<p>Used to position the tractor as close as possible to the side of the dock.</p><ul><li>Check that air and electrical lines are long enough and won&#39;t be pinched or torn</li><li>Pull past the dock while parallel to it; check clearance and visualize the path</li><li>Follow alley dock steps until rear wheels are 4–8 feet from the turning point</li><li>Turn the wheel to the right</li><li>Give the wheel a sharp right turn when the trailer is almost to the dock</li><li>Avoid over-jacking — too much angle can damage the tractor</li><li>Once docked, lower the landing gear for stability during loading/unloading</li><li>Raise the landing gear before driving away</li></ul>","narration":"Sometimes a straight-in approach won&#39;t work — you need the tractor positioned tight against the dock side so it&#39;s not sticking out into traffic. That&#39;s jackknife backing. For the sight side version, you&#39;re turning toward the driver&#39;s side, which gives you some visibility in the left mirror. Check your air and electrical lines first — they need enough slack that they won&#39;t be pulled or pinched during the turn. Pull past the dock parallel to it, then follow the alley dock sequence until your rear wheels are about 4 to 8 feet from the turning point. Turn right, and just as the trailer reaches the dock, give it a sharper right turn to swing the tractor in. Watch that angle — over-jacking can damage the tractor. Lower the landing gear once you&#39;re docked."},{"section":"maneuvers","sectionLabel":"Backing Maneuvers","title":"Blind Side Jackknife Backing","contentHTML":"<p>Used when the dock requires backing toward the right (passenger) side — most difficult jackknife maneuver:</p><ul><li>Always use a qualified spotter — keep the spotter in sight every second; stop every few feet to check clearances</li><li>Position the vehicle</li><li>When rear wheels reach the midpoint of the alley, turn the wheel to the left</li><li>Keep the spotter visible at all times</li><li>When the trailer is almost to the dock, turn the wheel hard to the left</li><li><strong>Never jack to more than a 90-degree angle between tractor and trailer</strong></li></ul>","narration":"Blind side jackknife is the most difficult of the jackknife maneuvers because you&#39;re turning away from the driver&#39;s side — toward the right — with very limited visibility. A qualified spotter is not optional here: keep them in your mirrors every single second. If you lose sight of the spotter, stop immediately. As your rear wheels reach the midpoint of the alley, begin turning left. Work slowly and check your clearances every few feet. When the trailer is almost to the dock, give a hard left turn to bring the tractor into alignment. And a critical safety limit: never let the angle between the tractor and trailer exceed 90 degrees — going beyond that risks serious damage to the vehicle."},{"section":"maneuvers","sectionLabel":"Backing Maneuvers","title":"Offset Backing","contentHTML":"<p>The most difficult backing maneuver — use only when necessary:</p><ol><li>Drive past the target space, leaving 3–8 feet from the end of the trailer to the opening</li><li>Check for clearances and obstructions</li><li>Begin backing; turn the wheel slightly left; increase the turn</li><li>Verify the right rear corner of the trailer is heading toward the right rear of the space</li><li>Continue until the front of the trailer is even with the front of the space</li><li>Turn the steering wheel hard right to jack the tractor into position</li><li>Turn the wheel sharply left and back into the space</li><li>Pull forward to adjust position and check clearances</li></ol>","narration":"Offset backing is parallel parking for a tractor-trailer — and it&#39;s the hardest maneuver on this list. Only use it when there&#39;s no other option. Set up by driving past the target and stopping with the end of your trailer 3 to 8 feet from the opening. Check your clearances before you start. Back slowly with a slight left turn, increasing that turn as the right rear corner of the trailer moves toward the right rear of the space. When the front of your trailer is even with the front of the space, turn the wheel hard right to swing the tractor. Then turn sharply left and back until you&#39;re in the space. Pull forward to adjust and fine-tune your position."},{"section":"safety","sectionLabel":"Backing Safely","title":"Safety Rules for Every Backing Maneuver","contentHTML":"<p>Apply these rules to every backing situation:</p><ul><li>Be patient — rushing backing causes accidents</li><li>Use the lowest reverse gear; back at idle speed; never ride the clutch</li><li>Don't over-steer — small corrections beat big swings</li><li>Back to the sight side (left) whenever possible</li><li>Use your vehicle's mirrors continuously</li><li>Use the horn and flashers to alert everyone in the area</li><li>Roll the windows down and keep noise eliminated</li><li>Watch for fixed objects: poles, curbs, building corners, dock edges</li><li>If the maneuver is going wrong, restart — don&#39;t back poorly into position</li></ul>","narration":"Whatever backing maneuver you&#39;re performing, these rules apply every time. Be patient. Slow is safe — fast is dangerous. Use the lowest reverse gear and don&#39;t give it any more throttle than idle speed. Don't ride the clutch. Make small corrections to the wheel rather than big sweeping moves — over-steering is one of the most common beginner mistakes. Use the sight side whenever the situation allows. Stay on your mirrors, keep the flashers going, and eliminate all cab noise so you can hear what's happening outside. Watch for fixed objects — dock corners, poles, and curbs are easy to forget when you&#39;re focused on the trailer. And if the maneuver is going sideways, don&#39;t dig deeper into a bad position. Pull forward and start over."},{"section":"docks","sectionLabel":"Docks & Parking Lots","title":"Loading Docks: Extra Precautions","contentHTML":"<p>Evaluate the receiving area before backing:</p><ul><li><strong>GOAL</strong> — pay extra attention to: parked vehicles and stationary objects, alleyways where vehicles could enter your path, unusual clearances and nearby barriers</li><li>Carefully open and secure trailer doors before backing in; check that cargo didn&#39;t shift in transit</li><li>Center the vehicle on approach — off-center approach risks damaging the vehicle and the dock</li><li>Some receivers require wheel chocks in addition to parking brakes — know the requirements</li><li>Slow and steady is the standard — it&#39;s professional and acceptable to restart a maneuver</li></ul>","narration":"Loading docks add a layer of complexity to backing. When you arrive, evaluate the receiving area before you even begin positioning. GOAL before every dock approach. Pay special attention to parked vehicles and objects nearby, any alleyways where a car or pedestrian could appear, and any unusual clearances or low barriers. Before you back in, open and secure your trailer doors — and while you&#39;re back there, check that your cargo didn&#39;t shift in transit. Center your vehicle on the approach. An off-center dock approach risks damage to both your equipment and the dock itself. Some receivers also require wheel chocks on top of your parking brakes — know the requirements before you arrive."},{"section":"docks","sectionLabel":"Docks & Parking Lots","title":"Parking Lots: Awareness and Position","contentHTML":"<p>Parking lots require extra vigilance because they're open to the public:</p><ul><li>Before entering a lot, evaluate: direction of traffic flow, location of parking stalls, positions of entrances and exits</li><li>Carefully position the vehicle to avoid striking parked vehicles</li><li>Get out and determine clearances before backing — don&#39;t assume you have room</li><li>Be aware of cars and pedestrians who may move into your path at any moment</li><li>If your backing maneuver is interrupted for any reason, conduct another full GOAL check before continuing</li></ul>","narration":"Parking lots are trickier than they look. They're open to the public — cars are coming and going, pedestrians appear out of nowhere, and traffic patterns aren&#39;t always obvious. Before you even pull into a lot, look at how traffic flows, where the stalls are, and where the exits are. That tells you how to position for the least amount of backing exposure. Before you back anywhere in a parking lot, get out and check your clearances. Don't trust that a spot is clear just because it looked clear from the cab. And if you have to stop for any reason during the maneuver, do another GOAL check before you start moving again."}];
const quizData = [{"q":"What does GOAL stand for?","opts":["Get On A Lookout","Get Out And Look","General Operations and Awareness Limit","Go Over All Lanes"],"ans":1,"exp":"GOAL stands for Get Out And Look. It means physically exiting the cab and walking around the vehicle to check all sides before any backing maneuver."},{"q":"Why should you eliminate noise inside the cab when backing?","opts":["It&#39;s required by FMCSA regulations","Your ears can help detect hazards that mirrors may not reveal","Noise interferes with the backup alarm signal","It prevents distracting other drivers nearby"],"ans":1,"exp":"Rolling the window down and eliminating cab noise lets your ears help you back safely. You can hear people shouting, equipment moving, or alarms that your mirrors might not catch."},{"q":"If you want the trailer to go to the right while backing, which direction do you turn the steering wheel?","opts":["Right","Left","Either direction — it doesn&#39;t matter","First right, then left"],"ans":1,"exp":"When backing a tractor-trailer, you always steer in the opposite direction you want the trailer to go. If you want the trailer to move right, turn the steering wheel left."},{"q":"What is 'jacking' in the context of backing techniques?","opts":["Raising the landing gear while backing","Turning the steering wheel to create a change in the trailer's direction","Using a hydraulic jack to support the trailer","Adjusting the fifth wheel height before docking"],"ans":1,"exp":"Jacking refers to turning the steering wheel to produce a change in the direction of the trailer while backing. The trailer 'jacks' in the opposite direction of the steering wheel."},{"q":"What is sight side backing?","opts":["Backing toward the right side of the vehicle","Backing in a straight line with no turns","Backing toward the left (driver&#39;s) side where you can see the trailer's path","Backing using only the driver&#39;s side mirror"],"ans":2,"exp":"Sight side backing means reversing toward the left — the driver&#39;s side. This allows the driver to see the intended path of the trailer through the left mirror. It&#39;s preferred because visibility is maximized."},{"q":"What should you do immediately if you lose sight of your spotter in the mirrors?","opts":["Slow down but continue backing","Continue with extra caution","Sound the horn and keep going","Stop immediately"],"ans":3,"exp":"If you lose sight of your spotter in the mirrors, stop immediately. The spotter must remain visible at all times. You have no way to know where they are or what they can see if they're out of your mirrors."},{"q":"Which backing maneuver is considered the most difficult?","opts":["Straight line backing","Sight side jackknife backing","Alley dock backing","Offset backing"],"ans":3,"exp":"Offset backing — sometimes called parallel parking — is the most difficult of the standard backing maneuvers. It requires precise multi-step execution and should only be used when no other option exists."},{"q":"During blind side jackknife backing, what is the maximum angle you should allow between the tractor and trailer?","opts":["45 degrees","60 degrees","90 degrees","120 degrees"],"ans":2,"exp":"You should never allow the angle between the tractor and trailer to exceed 90 degrees during jackknife backing. Going beyond this angle risks serious damage to the tractor."},{"q":"Why is straight line backing the most important skill to master first?","opts":["It&#39;s only used at loading docks","It&#39;s the foundation of all other backing maneuvers and should be mastered first","It&#39;s only relevant for short trailers","It&#39;s less important than alley dock backing"],"ans":1,"exp":"Straight line backing is fundamental to learning all other backing maneuvers. Every other technique builds on the control and coordination developed through straight line practice."},{"q":"How far from the dock should you stop before your final GOAL check when performing alley dock backing?","opts":["10–15 feet","6–8 feet","3–4 feet","Right at the bumper"],"ans":2,"exp":"During alley dock backing, stop the trailer about 3 to 4 feet from the dock, get out to check the remaining space, then ease the trailer to the dock. This final check prevents dock strikes."},{"q":"What does 'push-pull' steering mean when backing?","opts":["Using both hands alternately to push and pull the wheel in large rotations","When the trailer gets bigger in one mirror, push the steering wheel toward that mirror to correct","Alternating between forward and reverse to reposition","Pushing the trailer with the dock bumpers while pulling the landing gear"],"ans":1,"exp":"Push-pull steering is a correction technique: when the trailer appears larger in one mirror — meaning it&#39;s drifting that way — you push the steering wheel toward that mirror to bring it back on path."},{"q":"Why must you open and secure trailer doors before backing into a loading dock?","opts":["To allow dock workers to begin unloading immediately","FMCSA regulations require it for all dock operations","To prevent the doors from swinging and being damaged or torn off during approach","To allow the driver to see the dock from inside the trailer"],"ans":2,"exp":"Securing trailer doors in the open position before docking prevents them from swinging outward during approach, which could cause the doors to be damaged or torn off the hinges — and could endanger anyone nearby."},{"q":"What additional precaution do some shippers and receivers require beyond parking brakes?","opts":["Setting the fifth wheel lock","Wheel chocks to prevent rolling during loading/unloading","Releasing trailer brakes while at the dock","Raising the landing gear all the way up"],"ans":1,"exp":"Some shippers and receivers require wheel chocks in addition to parking brakes. This provides an extra layer of protection to ensure the vehicle won&#39;t roll forward during loading or unloading operations."},{"q":"When driving through a parking lot with a tractor-trailer, what should you evaluate before positioning?","opts":["Fuel prices and proximity to a fuel island","Direction of traffic flow, location of parking stalls, and positions of entrances and exits","The weight of the load and axle distribution","Number of available docks and lighting conditions"],"ans":1,"exp":"Before maneuvering through a parking lot, evaluate: how traffic flows through the lot, where the parking stalls are, and where the entrances and exits are. This helps you position correctly and minimize the backing required."},{"q":"If a backing maneuver is going poorly, what is the correct action?","opts":["Speed up to complete it before a problem develops","Continue slowly, hoping corrections will fix the path","Pull forward, reposition the trailer, and start the maneuver over","Ask a bystander to guide you in"],"ans":2,"exp":"When a backing maneuver is going wrong, the correct response is to pull forward, reposition the trailer, and start fresh. Trying to force a bad line while continuing in reverse almost always makes the situation worse."}];

let currentSlide=-1,completedSlides=new Set(),quizAnswers={},view='welcome';
function init(){Progress.markStarted(CURRENT_MODULE_SLUG);buildDropdown();buildTOC();showWelcome();}
function buildDropdown(){const all=Progress.getAll();const items=document.getElementById('dropdownItems');const hdr=document.getElementById('dropdownHeaderProgress');let done=0;REGISTRY.forEach(m=>{if(all[m.slug]&&all[m.slug].completed)done++;});hdr.textContent=done+' of '+REGISTRY.length+' complete';items.innerHTML='';REGISTRY.forEach(m=>{const isCurrent=m.slug===CURRENT_MODULE_SLUG;const prog=all[m.slug]||{};const unlocked=Progress.isUnlocked(m.slug,REGISTRY);const div=document.createElement('div');div.className='dropdown-item'+(isCurrent?' current':'')+((!unlocked)?' locked':' clickable');let icon='🔒',iconClass='';if(isCurrent){icon='▶';iconClass='';}else if(prog.completed){icon='✓';iconClass='color:var(--success)';}else if(unlocked){icon='○';iconClass='color:var(--blue)';}div.innerHTML='<span class="di-icon" style="'+iconClass+'">'+icon+'</span><span class="di-info"><span class="di-unit">UNIT '+m.unit+'</span><br><span class="di-title">'+m.title+'</span></span>';if(unlocked&&!isCurrent){div.addEventListener('click',()=>{window.location.href='../'+m.folder+'/'+m.file;});}items.appendChild(div);});}
const trigger=document.getElementById('unitTrigger'),menu=document.getElementById('dropdownMenu');
trigger.addEventListener('click',()=>{const open=menu.classList.toggle('open');trigger.setAttribute('aria-expanded',open);});
document.addEventListener('click',e=>{if(!document.getElementById('unitDropdown').contains(e.target)){menu.classList.remove('open');trigger.setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.classList.remove('open');trigger.setAttribute('aria-expanded','false');}});
function buildTOC(){const list=document.getElementById('tocList');list.innerHTML='';slides.forEach((s,i)=>{const done=completedSlides.has(i);const active=currentSlide===i;const accessible=done||i===0||completedSlides.has(i-1);const div=document.createElement('div');div.className='toc-item'+(active?' active':'')+(accessible?' accessible':'');div.innerHTML='<div class="toc-icon'+(done?' done':'')+(active&&!done?' active-icon':'')+'">'+( done?'✓':(i+1))+'</div><span class="toc-title">'+s.title+'</span>';if(accessible)div.addEventListener('click',()=>{showSlide(i);});list.appendChild(div);});const allDone=completedSlides.size===slides.length;const qDiv=document.createElement('div');qDiv.className='toc-item'+(view==='quiz'||view==='results'?' active':'')+(allDone?' accessible':'');qDiv.innerHTML='<div class="toc-icon'+(view==='results'?' done':'')+(view==='quiz'?' active-icon':'')+'">'+(view==='results'?'✓':'Q')+'</div><span class="toc-title">Knowledge Check</span>';if(allDone)qDiv.addEventListener('click',()=>{showQuiz();});list.appendChild(qDiv);updateProgressBar();}
function updateProgressBar(){const pct=slides.length>0?Math.round((completedSlides.size/slides.length)*100):0;document.getElementById('progressFill').style.width=pct+'%';}
function showWelcome(){view='welcome';currentSlide=-1;stopAudio();const main=document.getElementById('mainContent');main.innerHTML='<div class=\"welcome-view\"><div class=\"welcome-eyebrow\">Module 6 &nbsp;&middot;&nbsp; Unit 1.1.6</div><h1 class=\"welcome-title\">Backing and Docking</h1><div class=\"welcome-objectives\"><h3>What You&#39;ll Learn</h3><ul><li>Why backing is the most dangerous maneuver a professional driver performs</li><li>The GOAL procedure and general backing safety rules</li><li>Four steering techniques: jacking, chasing, following, and push-pull</li><li>Sight side vs. blind side backing</li><li>Five backing maneuvers: straight line, alley dock, jackknife, and offset</li><li>Extra precautions for loading docks and parking lots</li></ul></div><button class=\"btn-primary\" onclick=\"showSlide(0)\">Start Module &#9658;</button></div>';buildTOC();}
function showSlide(idx){view='slide';currentSlide=idx;stopAudio();const s=slides[idx];const thisDone=completedSlides.has(idx);const main=document.getElementById('mainContent');main.innerHTML='<div class="slide-view"><div class="slide-label">'+s.sectionLabel+'</div><h2 class="slide-title">'+s.title+'</h2><div class="slide-content">'+s.contentHTML+'</div><div class="narration-box"><div class="narration-header"><div class="narration-label"><span class="narration-icon">🔊</span><span>Narration</span></div><div class="audio-control"><button class="audio-btn" id="audioBtn" type="button" aria-label="Pause narration" onclick="togglePlayPause()">'+ICON_PAUSE+'</button><span class="audio-btn-label playing" id="audioBtnLabel">Playing</span></div></div><div class="narration-text">'+s.narration+'</div><div class="audio-progress"><div class="audio-progress-fill" id="audioProgress"></div></div></div><div class="slide-nav"><button class="btn-nav btn-back" onclick="'+(idx===0?'showWelcome()':'showSlide('+(idx-1)+')') +'">← '+(idx===0?'Welcome':'Previous')+'</button><button class="btn-nav btn-next" id="nextBtn" onclick="advanceSlide('+idx+')" disabled>'+(idx===slides.length-1?'Go to Quiz →':'Next →')+'</button></div></div>';buildTOC();if(thisDone){onAudioComplete(true);}else{startAudio(s.narration);}}
function advanceSlide(idx){completedSlides.add(idx);buildTOC();if(idx===slides.length-1){showQuiz();}else{showSlide(idx+1);}}
function showQuiz(){if(completedSlides.size<slides.length)return;view='quiz';stopAudio();quizAnswers={};const main=document.getElementById('mainContent');let html='<div class="quiz-view"><div class="quiz-header"><h2>Knowledge Check</h2><p>Answer all 15 questions. You need 80% or higher (12 of 15) to pass.</p></div>';quizData.forEach((q,qi)=>{html+='<div class="quiz-q" id="qq'+qi+'"><div class="quiz-q-text">'+(qi+1)+'. '+q.q+'</div><div class="quiz-opts">';q.opts.forEach((o,oi)=>{html+='<div class="quiz-opt" id="opt'+qi+'_'+oi+'" onclick="selectOpt('+qi+','+oi+')"><span class="opt-letter">'+String.fromCharCode(65+oi)+'.</span><span>'+o+'</span></div>';});html+='</div><div class="quiz-exp" id="exp'+qi+'"></div></div>';});html+='<div class="quiz-actions"><button class="btn-primary" onclick="submitQuiz()">Submit Answers</button></div></div>';main.innerHTML=html;buildTOC();}
function selectOpt(qi,oi){if(quizAnswers[qi]!==undefined)return;quizAnswers[qi]=oi;document.querySelectorAll('#opt'+qi+'_0,#opt'+qi+'_1,#opt'+qi+'_2,#opt'+qi+'_3').forEach(el=>el.classList.remove('selected'));document.getElementById('opt'+qi+'_'+oi).classList.add('selected');}
function submitQuiz(){if(Object.keys(quizAnswers).length<quizData.length){alert('Please answer all questions before submitting.');return;}let correct=0;quizData.forEach((q,qi)=>{const chosen=quizAnswers[qi];const isCorrect=chosen===q.ans;if(isCorrect)correct++;document.getElementById('opt'+qi+'_'+q.ans).classList.add('correct');if(!isCorrect)document.getElementById('opt'+qi+'_'+chosen).classList.add('incorrect');const expEl=document.getElementById('exp'+qi);expEl.textContent=q.exp;expEl.classList.add('show');document.querySelectorAll('#qq'+qi+' .quiz-opt').forEach(el=>{el.style.pointerEvents='none';});});const pct=Math.round((correct/quizData.length)*100);const pass=pct>=80;if(pass){Progress.markComplete(CURRENT_MODULE_SLUG,pct);buildDropdown();}setTimeout(()=>showResults(correct,pct,pass),800);}
function showResults(correct,pct,pass){view='results';const main=document.getElementById('mainContent');const nextMod=REGISTRY[REGISTRY.findIndex(m=>m.slug===CURRENT_MODULE_SLUG)+1]||null;main.innerHTML='<div class="results-view"><div class="welcome-eyebrow">Knowledge Check Complete</div><div class="results-score '+(pass?'pass':'fail')+'">'+pct+'%</div><div class="results-badge '+(pass?'pass':'fail')+'">'+(pass?'✓ PASSED':'✗ NOT PASSED')+'</div><p class="results-msg">You answered <strong>'+correct+' of '+quizData.length+'</strong> questions correctly.'+(pass?' Great work — you&#39;ve completed this module!':' A score of 80% or higher is required to pass. Review the material and try again.')+'</p><div class="results-actions">'+(pass&&nextMod?'<a class="btn-continue" href="../'+nextMod.folder+'/'+nextMod.file+'">Continue to Module '+(REGISTRY.findIndex(m=>m.slug===CURRENT_MODULE_SLUG)+2)+': '+nextMod.title+' →</a>':'')+(pass&&!nextMod?'<a class="btn-continue" href="../index.html">Back to Course Home →</a>':'')+(!pass?'<button class="btn-primary" onclick="showQuiz()">Retake Quiz</button>':'')+'<button class="btn-retry" onclick="showWelcome()">Review Module</button></div></div>';buildTOC();}
function startAudio(text){stopAudio();currentNarrationText=text;audioElapsed=0;isComplete=false;isPlaying=true;setAudioControlPlaying();if(USE_MP3){const path=AUDIO_BASE_PATH+'slide_'+String(currentSlide).padStart(2,'0')+'.mp3';currentAudio=new Audio(path);estimatedDuration=text.length/14;currentAudio.play().catch(()=>onAudioComplete(false));currentAudio.addEventListener('ended',()=>onAudioComplete(false));currentAudio.addEventListener('error',()=>onAudioComplete(false));audioPlayStart=Date.now();startProgressTimer();}else{playTTS(text,0);}}
function playTTS(text,startFraction){window.speechSynthesis.cancel();const words=text.split(' ');const startWord=Math.floor(startFraction*words.length);const slicedText=words.slice(startWord).join(' ');const utter=new SpeechSynthesisUtterance(slicedText);utter.rate=0.95;utter.lang='en-US';currentUtterance=utter;estimatedDuration=(text.length/14)*(1-startFraction);audioPlayStart=Date.now();startProgressTimer();utter.onend=()=>{if(isPlaying)onAudioComplete(false);};utter.onerror=()=>{if(isPlaying)onAudioComplete(false);};window.speechSynthesis.speak(utter);}
function startProgressTimer(){clearInterval(audioTimerInterval);audioTimerInterval=setInterval(()=>{if(!isPlaying)return;const elapsed=audioElapsed+(Date.now()-audioPlayStart)/1000;const pct=Math.min(100,Math.round((elapsed/estimatedDuration)*100));const bar=document.getElementById('audioProgress');if(bar)bar.style.width=pct+'%';if(elapsed>=estimatedDuration){onAudioComplete(false);}},500);}
function stopAudio(){clearInterval(audioTimerInterval);window.speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio=null;}currentUtterance=null;isPlaying=false;}
function togglePlayPause(){if(isPlaying){pauseAudio();}else{resumeAudio();}}
function pauseAudio(){audioElapsed+=(Date.now()-audioPlayStart)/1000;clearInterval(audioTimerInterval);if(USE_MP3&&currentAudio){currentAudio.pause();}else{window.speechSynthesis.cancel();}isPlaying=false;setAudioControlPaused();}
function resumeAudio(){if(isComplete)return;isPlaying=true;audioPlayStart=Date.now();if(USE_MP3&&currentAudio){currentAudio.play();startProgressTimer();}else{const frac=audioElapsed/(estimatedDuration||1);playTTS(currentNarrationText,Math.min(frac,0.99));}setAudioControlPlaying();}
function setAudioControlPlaying(){const btn=document.getElementById('audioBtn');const lbl=document.getElementById('audioBtnLabel');if(btn){btn.innerHTML=ICON_PAUSE;btn.disabled=false;btn.setAttribute('aria-label','Pause narration');}if(lbl){lbl.textContent='Playing';lbl.className='audio-btn-label playing';}}
function setAudioControlPaused(){const btn=document.getElementById('audioBtn');const lbl=document.getElementById('audioBtnLabel');if(btn){btn.innerHTML=ICON_PLAY;btn.disabled=false;btn.setAttribute('aria-label','Resume narration');}if(lbl){lbl.textContent='Paused';lbl.className='audio-btn-label paused';}}
function setAudioControlDone(){const btn=document.getElementById('audioBtn');const lbl=document.getElementById('audioBtnLabel');if(btn){btn.innerHTML=ICON_DONE;btn.disabled=true;btn.setAttribute('aria-label','Narration complete');}if(lbl){lbl.textContent='Complete';lbl.className='audio-btn-label complete';}}
function onAudioComplete(skipUnlock){clearInterval(audioTimerInterval);isPlaying=false;isComplete=true;const bar=document.getElementById('audioProgress');if(bar)bar.style.width='100%';setAudioControlDone();if(!skipUnlock){const nextBtn=document.getElementById('nextBtn');if(nextBtn)nextBtn.disabled=false;}}
init();
</script>
</body>
